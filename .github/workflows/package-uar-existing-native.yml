name: Package existing UAR native binaries
on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Completed integration-payload native build run matching this branch's source pins
        required: false
        type: string
      native_run_id:
        description: Existing caller alias for native_run
        required: false
        type: string
      source_revision:
        description: Optional exact UAR revision assertion; must match the source pin
        required: false
        type: string
      platforms:
        description: Ready Mac/Windows platforms from the selected native run
        required: true
        default: win32-x64,darwin-arm64
        type: string
permissions:
  contents: read
  actions: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          node <<'NODE'
          const targets = [
            { platform: 'win32-x64', runner: 'windows-2025', target: 'x86_64-pc-windows-msvc' },
            { platform: 'darwin-arm64', runner: 'macos-15', target: 'aarch64-apple-darwin' },
            { platform: 'win32-arm64', runner: 'windows-11-arm', target: 'aarch64-pc-windows-msvc' },
            { platform: 'darwin-x64', runner: 'macos-15-intel', target: 'x86_64-apple-darwin' }
          ]
          const requested = process.env.PLATFORMS.split(',').map(value => value.trim())
          if (!requested.length || new Set(requested).size !== requested.length || requested.some(value => !targets.some(target => target.platform === value)))
            throw new Error('Select unique supported UAR platforms')
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: targets.filter(target => requested.includes(target.platform)) })}\n`)
          NODE
  package:
    needs: select
    name: Reuse UAR (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Enable long paths for the pinned UAR checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Prepare the exact pinned UAR source
        env:
          INTEGRATION_TOOLS: uar-sidecar
          SELECTED_NATIVE_RUN: ${{ inputs.native_run || inputs.native_run_id }}
          EXPECTED_UAR_REVISION: ${{ inputs.source_revision }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          if (!process.env.SELECTED_NATIVE_RUN) throw new Error('Supply native_run or native_run_id')
          const pin = JSON.parse(fs.readFileSync('build/integration-sources.json', 'utf8')).sources.uar.revision
          if (process.env.EXPECTED_UAR_REVISION && process.env.EXPECTED_UAR_REVISION !== pin)
            throw new Error('source_revision must match the pinned UAR revision')
          execFileSync(process.execPath, ['scripts/integration-source.cjs'], { stdio: 'inherit' })
          NODE
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/integration-source/**/target
          key: native-${{ matrix.platform }}-uar-sidecar-${{ hashFiles('build/integration-sources.json') }}
      - name: Require exact completed native build cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: exit 1
      - uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.native_run || inputs.native_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: native-tools-${{ matrix.platform }}
          path: build/integration-output
      - name: Package existing binary without compilation
        run: node scripts/package-uar-from-native-artifact.cjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: uar-sidecar-${{ matrix.platform }}
          path: |
            build/integration-source/uar/dist/boss-sidecar/uar-sidecar-${{ matrix.platform }}.tar.gz
            build/integration-source/uar/dist/boss-sidecar/uar-sidecar-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90
